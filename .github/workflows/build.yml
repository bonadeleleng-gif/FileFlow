name: Build FileFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fileflow-apk-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare Android debug signing directory
        run: mkdir -p ~/.android

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: fileflow-debug-signing-key-v1

      - name: Create debug signing key if cache is empty
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build APK
        run: gradle lintDebug testDebugUnitTest assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FileFlow-APK
          path: app/build/outputs/apk/debug/app-debug.apk
